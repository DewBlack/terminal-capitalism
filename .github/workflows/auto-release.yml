# Historical file retained so its replacement is explicit in review.
# Pushes no longer create a tag, version or GitHub release.
name: Prepare release notes (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/versioning/version.py check --release
      - run: python3 scripts/versioning/version.py changelog --dry-run
