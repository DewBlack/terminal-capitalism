name: Publish to Itch.io

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Itch el artefacto validado (requiere aprobación de release)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate installed product version
        id: product
        run: |
          python3 scripts/versioning/version.py check --release
          echo "version=$(python3 -c 'import sys; sys.path.insert(0,"scripts/versioning"); from pathlib import Path; from version import source; print(source(Path("."))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Godot Export
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
        env:
          GITHUB_TOKEN: ${{secrets.GH_TOKEN}}
      - name: Inspect effective Web artifact and bind evidence
        shell: bash
        run: |
          archive="${{ steps.export.outputs.archive_directory }}/export-web.zip"
          unzip -q "$archive" -d "$RUNNER_TEMP/versioned-web"
          pck=$(find "$RUNNER_TEMP/versioned-web" -name '*.pck' -print -quit)
          test -n "$pck"
          python3 scripts/versioning/version.py manifest "$pck" --platform web --environment web --channel itch --output "$archive.manifest.json"
          sha256sum "$archive" > "$archive.sha256"

      - name: Preserve reviewable Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: capitalismo-terminal-${{ steps.product.outputs.version }}-${{ github.sha }}-web
          path: |
            ${{ steps.export.outputs.archive_directory }}/export-web.zip
            ${{ steps.export.outputs.archive_directory }}/export-web.zip.manifest.json
            ${{ steps.export.outputs.archive_directory }}/export-web.zip.sha256

      - name: Publish to Itch
        if: ${{ inputs.publish && github.ref_name == 'main' }}
        uses: Ayowel/butler-to-itch@v1.2.0
        with:
          butler_key: ${{secrets.ITCHIO_TOKEN}}
          itch_user: andreullorens
          itch_game: capitalismo-terminal
          version: ${{ steps.product.outputs.version }}
          files: "${{ steps.export.outputs.archive_directory }}/export-web.zip"